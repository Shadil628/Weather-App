
<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather Dashboard</title>

    <link href="style.css" rel="stylesheet">

</head>

<body>

    <div class="container">

        <!-- Theme Toggle -->

        <div class="theme-toggle">

            <button id="themeBtn">🌙 Dark</button>

        </div>

        <!-- Search Section -->

        <div class="search-section">

            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name..."
            />

            <button id="searchBtn">Search Weather</button>

        </div>

        <!-- Loading -->

        <div id="loading" style="display: none;">

            Loading...

        </div>

        <!-- Weather Display -->

        <div
            id="weatherCard"
            class="weather-card"
            style="display: none;"
        ></div>

        <!-- 5 Day Forecast -->

        <div
            id="forecastContainer"
            class="forecast-container"
            style="display: none;"
        >

            <h2>5-Day Forecast</h2>

            <div id="forecastList"></div>

        </div>

        <!-- Error Message -->

        <div
            id="errorMsg"
            class="error"
            style="display: none;"
        ></div>

        <!-- Favorites -->

        <div class="favorites-section">

            <h3>Favorites</h3>

            <div id="favoritesList"></div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
